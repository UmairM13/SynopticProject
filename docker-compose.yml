version: "3.8"

services:
  backend:
    build: .
    container_name: recommendation_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: ./travel_frontend
    container_name: travel_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
